name: Sydney Water

description: Sydney Water is the statutory state-owned water utility serving Greater Sydney, New South Wales, Australia. Its
  own site describes its role as supplying water, wastewater, recycled water and stormwater services, protecting public health,
  managing the environment and the health of Greater Sydney's waterways. The site offers a My Account customer portal for
  billing and meter reading, plumbing, building and developing services, and supplier and tender information. No public developer
  API portal was found on its site.

